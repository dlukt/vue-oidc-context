name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      # Without this, a failure on the not-yet-LTS 26 cancels the 22 and 24 jobs,
      # which hides whether a break is Node-26-specific or general.
      fail-fast: false
      matrix:
        # 22 and 24 are the active LTS lines; 26 is Current and becomes LTS in
        # October 2026 — here early so regressions surface before the promotion.
        node-version: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm build
      - name: Core dist types compile without vue-router (M4 fixture)
        run: pnpm typecheck:fixtures
      - name: Playground builds against the packaged entries (M5)
        run: pnpm --filter playground build
      - run: pnpm pack
      - name: Guard suite against vue-router 4 (oldest supported peer major)
        run: |
          pnpm add -Dw "vue-router@^4.2.0"
          pnpm typecheck
          pnpm vitest run test/router.test.ts
